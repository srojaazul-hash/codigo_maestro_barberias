<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Control - {{ config.nombre_negocio }}</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .cita-card { 
            background: #333; padding: 15px; border-radius: 8px; 
            margin-bottom: 15px; border-left: 5px solid {{ config.color_principal }}; 
        }
        .hora { font-size: 1.5em; font-weight: bold; color: {{ config.color_principal }}; }
        .cliente { font-size: 1.2em; margin: 5px 0; }
        .servicios { color: #aaa; font-style: italic; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .badge { background: #555; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; }
    </style>
</head>
<body>

    <div class="header">
       <h1>Agenda</h1>
        <div class="badge">{{ fecha }}</div>
    </div>

   <div style="margin-bottom: 20px; background: #333; padding: 15px; border-radius: 8px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
        <div>
            <label for="buscador-fecha" style="font-weight: bold;">📅 Ver día: </label>
            <input type="date" id="buscador-fecha" value="{{ fecha }}" onchange="actualizarFiltros()" style="padding: 5px; margin-left: 5px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white;">
        </div>
        <div>
            <label for="buscador-barbero" style="font-weight: bold;">✂️ Barbero: </label>
            <select id="buscador-barbero" onchange="actualizarFiltros()" style="padding: 5px; margin-left: 5px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white;">
                <option value="Todos" {% if barbero_seleccionado == 'Todos' %}selected{% endif %}>Todos</option>
                {% for b in config.barberos %}
                <option value="{{ b }}" {% if barbero_seleccionado == b %}selected{% endif %}>{{ b }}</option>
                {% endfor %}
            </select>
        </div>
        <script>
            function actualizarFiltros() {
                const f = document.getElementById('buscador-fecha').value;
                const b = document.getElementById('buscador-barbero').value;
                window.location.href = '/admin?fecha=' + f + '&barbero=' + b;
            }
        </script>
    </div>

    <div style="background: #333; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444;">
        <h3 style="margin-top: 0; color: {{ config.color_principal }};">➕ Reservar o Bloquear Horas</h3>
        <form action="/admin_reservar" method="POST" style="display: flex; gap: 10px; flex-wrap: wrap;">
           <input type="text" name="nombre" placeholder="Concepto (Ej: Vacaciones o Cliente)" required style="flex: 1; padding: 10px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white; min-width: 200px;">
            <input type="date" name="fecha" value="{{ fecha }}" required style="padding: 10px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white;">
            <input type="time" name="hora_inicio" required style="padding: 10px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white;">
            <input type="number" name="duracion" placeholder="Minutos" required style="width: 100px; padding: 10px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white;">
            <select name="barbero" required style="padding: 10px; font-size: 16px; border-radius: 4px; border: none; background: #222; color: white;">
                {% for b in config.barberos %}
                <option value="{{ b }}" {% if barbero_seleccionado == b %}selected{% endif %}>{{ b }}</option>
                {% endfor %}
            </select>
        </form>
    </div>

    {% if citas %}
        {% for cita in citas %}
        <div class="cita-card" style="{% if cita.cliente_telefono == 'ADMIN_BLOCK' %} border-left-color: #666; opacity: 0.8; background: #2a2a2a; {% endif %}">
            <div class="hora">{{ cita.hora_inicio }} - {{ cita.hora_fin }}</div>
            <div class="cliente">{{ cita.cliente_nombre }}</div>
            <div class="servicios">{{ cita.servicios_json }}</div>
            <div style="margin-top:10px;">
                <a href="tel:{{ cita.cliente_telefono }}" style="color: lightblue; text-decoration: none;">📞 Llamar</a>
                <form action="/cancelar/{{ cita.id }}" method="POST" onsubmit="return confirm('¿Seguro que quieres cancelar y borrar esta cita?');" style="display:inline; float:right;">
                    <input type="hidden" name="fecha_actual" value="{{ fecha }}">
                    <button type="submit" style="background: #cc0000; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">❌ Cancelar</button>
                </form>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p>No tienes citas para hoy. ¡Día de relax!</p>
    {% endif %}

    <button onclick="location.reload()" style="width:100%; padding:15px; background: #444; color:white; border:none; border-radius:5px; margin-top:20px;">🔄 Actualizar Agenda</button>

</body>
</html>
